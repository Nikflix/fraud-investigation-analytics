[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-investigation-analytics"
version = "0.1.0"
description = "Transaction validation and local ingestion for fraud investigation analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<2",
    "pytz>=2025.2",  # DuckDB uses this when returning timezone-aware datetimes.
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fraud-analytics = "fraud_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
