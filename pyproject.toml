[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-investigation-analytics"
version = "0.2.0"
description = "Local transaction scoring and review for fraud investigation analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<2",
    "pytz>=2025.2",  # DuckDB uses this when returning timezone-aware datetimes.
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
analysis = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.7,<2"]
app = ["streamlit>=1.55,<2", "pandas>=2.2,<4", "plotly>=6,<7", "numpy>=1.26,<3", "scikit-learn>=1.7,<2"]

[project.scripts]
fraud-analytics = "fraud_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_analytics = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
