name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and test dependency
        run: python -m pip install -e ".[dev]"
      - name: Run validation test
        run: python -m pytest
      - name: Validate sample data
        run: fraud-analytics validate data/sample/transactions.csv
